<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Circular Badge with Gold Trim -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Royal Crown / Culinary Flame -->
  <path d="M44 48 L54 34 L64 42 L74 34 L84 48 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="54" cy="32" r="3" fill="#fbbf24" />
  <circle cx="64" cy="38" r="3.5" fill="#f59e0b" />
  <circle cx="74" cy="32" r="3" fill="#fbbf24" />

  <!-- Central Crest: RRR Monogram -->
  <text x="64" y="80" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="34" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="2">RR</text>

  <!-- Subtitle Ribbon -->
  <path d="M34 94 Q64 100 94 94 L92 101 Q64 107 36 101 Z" fill="url(#redAccent)" />
  <text x="64" y="100" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="7" 
        font-weight="800" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="1.5">RAB RAZI</text>
</svg>